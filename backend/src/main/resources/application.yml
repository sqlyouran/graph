server:
  port: 8080

spring:
  ai:
    openai:
      base-url: https://dashscope.aliyuncs.com/compatible-mode
      api-key: ${DASHSCOPE_API_KEY}
      chat:
        options:
          model: qwen3.8-max

looptrip:
  chapter: 4
  constraints:
    route:
      max-cross-area-per-day: 2
      min-transfer-minutes: 40
    pace:
      min-attractions-per-day: 2
      max-attractions-per-day: 4
      max-activity-minutes-per-day: 540
      meal-window-start: "11:00"
      meal-window-end: "14:00"
