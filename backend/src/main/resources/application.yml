server:
  port: 8080

spring:
  http:
    client:
      connect-timeout: 10s
      read-timeout: 120s

  ai:
    retry:
      max-attempts: 1
    openai:
      base-url: https://dashscope.aliyuncs.com/compatible-mode
      api-key: ${DASHSCOPE_API_KEY}
      chat:
        options:
          model: qwen3.8-flash
          temperature: 0.2
          # 注意：qwen3.8-flash 默认开启思考，且思考与回答共用该预算；
          # yml 的 extra-body.enable_thinking 经 Spring AI 1.1.2 序列化后是嵌套字段，网关不认，实际关不掉思考。
          # 预算必须大于"思考峰值+完整 TripPlan JSON"，实测思考可达 ~8k tokens，故留 32768。
          max-completion-tokens: 32768
          extra-body:
            enable_thinking: false

looptrip:
  chapter: 4
  max-tokens: 20000
  max-duration: 5m
  multiplier: 1.2
  same-fingerprint-limit: 2
  session:
    max-live: 20
    ttl: 30m
    storage-path: data/planning-sessions
  constraints:
    route:
      max-cross-area-per-day: 2
      min-transfer-minutes: 40
    pace:
      min-attractions-per-day: 2
      max-attractions-per-day: 4
      max-activity-minutes-per-day: 540
      meal-window-start: "11:00"
      meal-window-end: "14:00"
  context:
    max-tokens: 6000
    safety-margin: 0.15
  preference:
    storage-path: data/profiles
    default-user: course-demo-user
    min-sessions: 3
    decay-days: 90
    decay-drop: 0.25
    delete-threshold: 0.3
    max-recall: 8
